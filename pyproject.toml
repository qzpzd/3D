[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "industrial-pointcloud3d"
version = "0.1.0"
description = "Traditional and deep 3D point-cloud baselines for industrial inspection"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "torch>=2.1",
  "matplotlib>=3.7",
  "pytest>=7.4",
]

[project.optional-dependencies]
open3d = ["open3d>=0.19"]

[tool.setuptools.packages.find]
include = ["industrial_pc3d*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

